<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pitoyy AI</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#070707;color:white;height:100vh;display:flex;flex-direction:column}

/* LOADING */
#loader{
position:fixed;top:0;left:0;width:100%;height:100vh;
background:#050505;display:flex;flex-direction:column;
justify-content:center;align-items:center;z-index:999999;transition:.5s;
}
.logo{
font-size:32px;font-weight:bold;color:red;
text-shadow:0 0 22px red;animation:pulse 1s infinite;
}
.spinner{
width:70px;height:70px;border:5px solid #222;
border-top:5px solid red;border-radius:50%;
margin:20px 0;animation:spin 1s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.1)}}

/* HEADER */
header{
background:linear-gradient(90deg,#7a0000,red,#111);
padding:16px;text-align:center;box-shadow:0 0 25px red;
}
header h1{font-size:24px}
header p{font-size:12px;color:#ffdada}

/* CHAT */
#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
max-width:85%;
padding:12px 14px;
border-radius:15px;
font-size:14px;
line-height:1.5;
white-space:pre-wrap;
word-wrap:break-word;
}

.user{
align-self:flex-end;
background:red;
box-shadow:0 0 10px #8b0000;
border-bottom-right-radius:2px;
}

.ai{
align-self:flex-start;
background:#151515;
border:1px solid #333;
box-shadow:0 0 10px #111;
border-bottom-left-radius:2px;
}

.typing{
color:#aaa;
font-size:13px;
padding:5px 10px;
display:none;
}

/* QUICK MENU */
.quick{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px;
background:#0b0b0b;
border-top:1px solid #222;
}
.quick button{
white-space:nowrap;
padding:9px 12px;
border:none;
border-radius:20px;
background:#151515;
color:white;
border:1px solid red;
}

/* INPUT */
.inputBox{
display:flex;
gap:8px;
padding:10px;
background:#0b0b0b;
border-top:1px solid #222;
}

textarea{
flex:1;
height:45px;
max-height:120px;
resize:none;
border:none;
outline:none;
border-radius:12px;
padding:12px;
background:#151515;
color:white;
border:1px solid #333;
}

button.send{
width:75px;
border:none;
border-radius:12px;
background:red;
color:white;
font-weight:bold;
box-shadow:0 0 12px red;
}

button:active{transform:scale(.96)}

.error{
background:#3a0000;
border:1px solid red;
}
</style>
</head>

<body>

<div id="loader">
  <div class="logo">PITOYY AI</div>
  <div class="spinner"></div>
  <p>Loading Assistant...</p>
</div>

<header>
  <h1>Pitoyy AI</h1>
  <p>Asisten AI untuk chat, caption, bio, dan ide konten</p>
</header>

<div id="chat">
  <div class="msg ai">Halo! Saya Pitoyy AI. Mau tanya apa?</div>
</div>

<div class="typing" id="typing">AI sedang mengetik...</div>

<div class="quick">
  <button onclick="quickAsk('Buatkan bio WhatsApp keren untuk seller digital')">Bio WA</button>
  <button onclick="quickAsk('Buatkan caption promosi singkat dan keren')">Caption</button>
  <button onclick="quickAsk('Buatkan deskripsi aplikasi Android saya')">Deskripsi APK</button>
  <button onclick="quickAsk('Bantu ringkas teks ini')">Ringkas</button>
</div>

<div class="inputBox">
  <textarea id="pesan" placeholder="Tulis pesan..."></textarea>
  <button class="send" onclick="kirim()">Kirim</button>
</div>

<script>
const API_URL = "https://pitoyy.vercel.app/api/chat"; 
// GANTI dengan URL API Vercel kamu, contoh:
// https://nama-project.vercel.app/api/chat

function tambahPesan(text, siapa, isError=false){
  const chat = document.getElementById("chat");
  const div = document.createElement("div");
  div.className = "msg " + siapa + (isError ? " error" : "");
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function quickAsk(text){
  document.getElementById("pesan").value = text;
  kirim();
}

async function kirim(){
  const input = document.getElementById("pesan");
  const pesan = input.value.trim();

  if(!pesan) return;

  tambahPesan(pesan, "user");
  input.value = "";

  const typing = document.getElementById("typing");
  typing.style.display = "block";

  try{
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({ pesan: pesan })
    });

    const data = await res.json();

    typing.style.display = "none";

    if(data.jawaban){
      tambahPesan(data.jawaban, "ai");
    }else{
      tambahPesan("AI tidak memberi jawaban. Cek API kamu.", "ai", true);
    }

  }catch(err){
    typing.style.display = "none";
    tambahPesan("Gagal terhubung ke API. Pastikan URL API benar dan sudah deploy di Vercel.", "ai", true);
  }
}

document.getElementById("pesan").addEventListener("keydown", function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    kirim();
  }
});

window.addEventListener("load",()=>{
  setTimeout(()=>{
    document.getElementById("loader").style.opacity="0";
    setTimeout(()=>{
      document.getElementById("loader").remove();
    },500);
  },2000);
});
</script>

</body>
</html>
